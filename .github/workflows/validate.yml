name: Validate skill distribution

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate metadata and distribution
        run: python3 scripts/validate.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify release archives
        run: python3 scripts/package.py --output-dir /tmp/subagents-workflow-dist
